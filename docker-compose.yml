version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://root:password@db:3306/homework_ai
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - TZ=Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8
    command:
      - --default-time-zone=+08:00
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=homework_ai
      - TZ=Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data: